# ~/.config/starship.toml  (Catppuccin Latte)
add_newline = true
command_timeout = 1000
palette = "catppuccin_latte"

format = """
$directory$git_branch$git_status$nodejs$python$rust$golang$docker_context
$cmd_duration$time$line_break$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
read_only = " 🔒"

[git_branch]
symbol = " "
style = "bold mauve"
truncation_length = 32

[git_status]
style = "bold peach"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = "*"

[nodejs]
symbol = " "
format = 'via [$symbol($version )]($style)'
style = "bold green"

[python]
symbol = " "
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'
style = "bold yellow"

[rust]
symbol = " "
format = 'via [$symbol($version )]($style)'
style = "bold maroon"

[golang]
symbol = " "
format = 'via [$symbol($version )]($style)'
style = "bold sky"

[docker_context]
symbol = " "
format = 'via [$symbol$context]($style)'
style = "bold sapphire"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[time]
disabled = false
time_format = "%H:%M"
format = "at [$time]($style) "
style = "bold overlay0"

