# ~/.config/yazi/yazi.toml
# Catppuccin Latte colours live in theme.toml.

[mgr]
ratio = [3, 3, 10]

[preview]
max_width  = 2000
max_height = 2400

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", for = "unix", block = true },
]

[plugin]
prepend_previewers = [
  { url = "*.md", run = 'bat --style=plain --color=always --paging=never "$1"' },
]
